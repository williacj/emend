# ABOUTME: Operator-only benchmark comparing one full Windows job with two simultaneous full jobs.
# ABOUTME: Captures CPU/disk pressure per isolated runner without changing production serialization.

name: Windows runner contention benchmark
run-name: Windows contention (${{ inputs.host_label }}, ${{ inputs.parallelism }}, cargo jobs=${{ inputs.cargo_build_jobs }}, target ${{ inputs.target_sha }})

on:
  workflow_dispatch:
    inputs:
      host_label:
        description: Physical Windows host whose runners must be measured
        required: true
        default: host-williacj-01
        type: choice
        options:
          - host-williacj-01
          - host-finn-pc10
      parallelism:
        description: Number of simultaneous full jobs
        required: true
        default: one
        type: choice
        options:
          - one
          - two
      cargo_build_jobs:
        description: Rust build jobs per measured slot (uncapped or a positive integer)
        required: true
        default: uncapped
        type: string
      target_sha:
        description: Immutable 40-character commit SHA both jobs should test
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  full-suite:
    name: Full suite contention (${{ matrix.slot }}, ${{ inputs.parallelism }}, cargo jobs=${{ inputs.cargo_build_jobs }})
    runs-on: [self-hosted, Windows, "${{ inputs.host_label }}"]
    timeout-minutes: 15
    env:
      GGML_CCACHE: "OFF"
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.parallelism == 'two' && '["base","peer"]' || '["base"]') }}
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Validate benchmark inputs
        env:
          EMEND_TARGET_SHA: ${{ inputs.target_sha }}
          EMEND_CARGO_BUILD_JOBS: ${{ inputs.cargo_build_jobs }}
        run: |
          if ($env:EMEND_TARGET_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'target_sha must be an immutable 40-character commit SHA'
          }
          if ($env:EMEND_CARGO_BUILD_JOBS -ne 'uncapped' -and
              $env:EMEND_CARGO_BUILD_JOBS -notmatch '^[1-9][0-9]*$') {
            throw 'cargo_build_jobs must be uncapped or a canonical positive integer'
          }
          if ($env:EMEND_CARGO_BUILD_JOBS -ne 'uncapped') {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_BUILD_JOBS=$env:EMEND_CARGO_BUILD_JOBS"
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}

      - name: Stage hostname evidence
        run: |
          $hostEvidence = Join-Path $env:RUNNER_TEMP ("cowrite-contention-host-" + "${{ matrix.slot }}" + ".txt")
          Set-Content -LiteralPath $hostEvidence -Value $env:COMPUTERNAME -NoNewline

      - name: Publish hostname evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contention-host-${{ matrix.slot }}
          path: ${{ runner.temp }}\cowrite-contention-host-${{ matrix.slot }}.txt
          if-no-files-found: error
          retention-days: 1

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-09
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          package-manager-cache: false

      # This operator probe compiles the ordinary app feature set too; prepare native Whisper
      # before sampling so setup time is not mistaken for compiler pressure.
      - name: Provision Windows Whisper tools
        id: whisper
        run: ./scripts/provision-whisper-windows.ps1

      # Qualification must be reproducible from the run rather than from an operator's memory of the
      # box. Do not print Defender exclusion values: the decision needs their count and whether this
      # workspace is covered, while the paths themselves can disclose unrelated host layout.
      - name: Report host qualification inventory
        run: |
          $processor = Get-CimInstance Win32_Processor | Select-Object -First 1
          $computer = Get-CimInstance Win32_ComputerSystem
          $workspace = Get-Item -LiteralPath $env:GITHUB_WORKSPACE
          $workspaceDrive = $workspace.PSDrive
          $volume = Get-Volume -DriveLetter $workspaceDrive.Name -ErrorAction Stop
          $partition = Get-Partition -DriveLetter $workspaceDrive.Name -ErrorAction Stop
          $disk = $partition | Get-Disk -ErrorAction Stop | Select-Object -First 1
          $workspacePath = [IO.Path]::GetFullPath($workspace.FullName).TrimEnd('\')
          $defenderStatusState = 'available'
          $defenderService = 'unknown'
          $defenderAntivirus = 'unknown'
          $defenderRealtime = 'unknown'
          try {
            $defender = Get-MpComputerStatus -ErrorAction Stop
            $defenderService = $defender.AMServiceEnabled
            $defenderAntivirus = $defender.AntivirusEnabled
            $defenderRealtime = $defender.RealTimeProtectionEnabled
          } catch {
            $defenderStatusState = "unavailable_error=$($_.Exception.HResult)"
          }

          $defenderPreferenceState = 'available'
          $workspaceExcluded = 'unknown'
          $exclusionCount = 'unknown'
          try {
            $preference = Get-MpPreference -ErrorAction Stop
            $exclusionPaths = @($preference.ExclusionPath | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            $exclusionCount = $exclusionPaths.Count
            $workspaceExcluded = $false
            foreach ($candidate in $exclusionPaths) {
              $expanded = [Environment]::ExpandEnvironmentVariables($candidate)
              if (-not [IO.Path]::IsPathRooted($expanded)) { continue }
              $excludedRoot = [IO.Path]::GetFullPath($expanded).TrimEnd('\')
              if ($workspacePath.Equals($excludedRoot, [StringComparison]::OrdinalIgnoreCase) -or
                  $workspacePath.StartsWith("$excludedRoot\", [StringComparison]::OrdinalIgnoreCase)) {
                $workspaceExcluded = $true
                break
              }
            }
          } catch {
            $defenderPreferenceState = "unavailable_error=$($_.Exception.HResult)"
          }

          $sccacheVersion = (& sccache --version) -join ' '
          if ($LASTEXITCODE -ne 0) { throw 'sccache --version failed during qualification inventory' }
          $sccacheServer = Get-Process sccache -ErrorAction Stop |
            Sort-Object -Property StartTime |
            Select-Object -First 1
          $nodeVersion = (& node --version) -join ' '
          if ($LASTEXITCODE -ne 0) { throw 'node --version failed during qualification inventory' }
          $gitVersion = (& git --version) -join ' '
          if ($LASTEXITCODE -ne 0) { throw 'git --version failed during qualification inventory' }
          $runnerRoot = Split-Path -Parent (Split-Path -Parent $env:RUNNER_WORKSPACE)
          $listenerPath = Join-Path $runnerRoot 'bin\Runner.Listener.exe'
          if (-not (Test-Path -LiteralPath $listenerPath -PathType Leaf)) {
            throw "Runner.Listener.exe was not found under resolved runner root $runnerRoot"
          }
          $runnerVersion = (Get-Item -LiteralPath $listenerPath).VersionInfo.FileVersion

          Write-Output "cpu=$($processor.Name) cores=$($processor.NumberOfCores) logical_processors=$($processor.NumberOfLogicalProcessors) memory_bytes=$($computer.TotalPhysicalMemory)"
          Write-Output "workspace_disk=$($disk.FriendlyName) media=$($disk.MediaType) bus=$($disk.BusType) disk_bytes=$($disk.Size) filesystem=$($volume.FileSystem) volume_bytes=$($volume.Size) volume_free_bytes=$($volume.SizeRemaining)"
          Write-Output "defender_status=$defenderStatusState defender_service=$defenderService antivirus=$defenderAntivirus realtime=$defenderRealtime defender_preference=$defenderPreferenceState exclusion_path_count=$exclusionCount workspace_excluded=$workspaceExcluded"
          Write-Output "sccache_version=$sccacheVersion server_pid=$($sccacheServer.Id) server_path=$($sccacheServer.Path)"
          Write-Output "node_version=$nodeVersion git_version=$gitVersion powershell_version=$($PSVersionTable.PSVersion) runner_version=$runnerVersion"
          Write-Output "runner_name=$env:RUNNER_NAME runner_os=$env:RUNNER_OS runner_arch=$env:RUNNER_ARCH runner_workspace=$env:RUNNER_WORKSPACE github_workspace=$env:GITHUB_WORKSPACE"

      - name: Validate isolated overlapping cohort
        env:
          GH_TOKEN: ${{ github.token }}
          EMEND_TARGET_SHA: ${{ inputs.target_sha }}
          EMEND_PARALLELISM: ${{ inputs.parallelism }}
          EMEND_CARGO_BUILD_JOBS: ${{ inputs.cargo_build_jobs }}
        run: node scripts/windows-contention-cohort.mjs start

      - name: Download hostname evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: contention-host-*
          path: ${{ runner.temp }}\cowrite-contention-host-evidence
          merge-multiple: true

      - name: Validate co-located host cohort
        run: |
          $expected = if ("${{ inputs.parallelism }}" -eq 'two') { 2 } else { 1 }
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'cowrite-contention-host-evidence'
          $hostFiles = @(Get-ChildItem -LiteralPath $evidenceRoot -Filter 'cowrite-contention-host-*.txt' -File)
          $arguments = @('scripts/windows-host-cohort.mjs', "$expected") + @($hostFiles.FullName)
          & node @arguments
          if ($LASTEXITCODE -ne 0) {
            throw 'Contention benchmark hostname evidence did not prove a co-located cohort.'
          }

      - name: Start host sampler
        run: |
          $samplesPath = Join-Path $env:RUNNER_TEMP ("cowrite-contention-" + "${{ matrix.slot }}" + "-" + $env:GITHUB_RUN_ATTEMPT + ".jsonl")
          $stopPath = "$samplesPath.stop"
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\windows-host-sampler.ps1'
          $powershell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $arguments = "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$scriptPath`" -OutputPath `"$samplesPath`" -StopPath `"$stopPath`""
          $process = Start-Process -FilePath $powershell -ArgumentList $arguments -PassThru -WindowStyle Hidden
          $startedTicks = $process.StartTime.ToUniversalTime().Ticks
          $startedAt = $process.StartTime.ToUniversalTime().ToString('o')
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "EMEND_SAMPLER_PID=$($process.Id)"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "EMEND_SAMPLER_STARTED_TICKS=$startedTicks"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "EMEND_SAMPLER_STARTED_AT=$startedAt"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "EMEND_SAMPLES_PATH=$samplesPath"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "EMEND_SAMPLER_STOP=$stopPath"
          $sampleReady = $false
          for ($attempt = 0; $attempt -lt 10; $attempt++) {
            $process.Refresh()
            if ($process.HasExited) {
              throw "Host sampler exited during startup with code $($process.ExitCode)"
            }
            if ((Test-Path -LiteralPath $samplesPath) -and (Get-Item -LiteralPath $samplesPath).Length -gt 0) {
              $sampleReady = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $sampleReady) {
            throw 'Host sampler produced no startup sample within 10 seconds'
          }

      - name: Rust fmt check
        env:
          EMEND_CARGO_BUILD_JOBS: ${{ inputs.cargo_build_jobs }}
        run: |
          if ($env:EMEND_CARGO_BUILD_JOBS -eq 'uncapped') {
            Remove-Item Env:CARGO_BUILD_JOBS -ErrorAction SilentlyContinue
          }
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      # #2293: !cancelled() stays true after a failed toolchain pin, so without this the step would
      # compile against whatever Rust happened to already be on the runner instead of the pinned
      # 1.97.0 — the same defect #2275 fixed in windows-self-hosted.yml.
      - name: Rust clippy
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.whisper.outcome == 'success' }}
        env:
          EMEND_CARGO_BUILD_JOBS: ${{ inputs.cargo_build_jobs }}
        run: |
          if ($env:EMEND_CARGO_BUILD_JOBS -eq 'uncapped') {
            Remove-Item Env:CARGO_BUILD_JOBS -ErrorAction SilentlyContinue
          }
          cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Cargo test
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.whisper.outcome == 'success' }}
        env:
          EMEND_CARGO_BUILD_JOBS: ${{ inputs.cargo_build_jobs }}
        run: |
          if ($env:EMEND_CARGO_BUILD_JOBS -eq 'uncapped') {
            Remove-Item Env:CARGO_BUILD_JOBS -ErrorAction SilentlyContinue
          }
          cargo test --manifest-path src-tauri/Cargo.toml --workspace

      # #2293: same shape, one toolchain earlier — these steps invoke npm/node directly, so a failed
      # Node setup must not let them run against whatever Node happened to already be on the runner.
      - name: Install dependencies
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm ci

      - name: tooling self-test
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm run test:scripts

      - name: Validate docs/test-matrix.md
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm run matrix:check

      - name: Validate vitest unhandled-errors invariant (test-plan §9b)
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm run check:vitest-unhandled-errors

      - name: vitest
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm run test --if-present

      # Named exception to the #2293 fix above, deliberately: this step must run under always().
      # Gating it on steps.node.outcome the way the fixed steps above are gated would NOT protect
      # against a dangling sampler — Start host sampler carries no `if:` of its own, so it sits on
      # the same default success() chain as everything upstream of it: it only ever runs when
      # Setup Node.js (and Install Rust before it) already succeeded, so its having started implies
      # the Node pin succeeded. Gating on steps.node.outcome would therefore only suppress cleanup
      # in exactly the case where the sampler never started — i.e. where there is nothing to clean
      # up. always() exists for the opposite case: a failure in one of the steps between Start host
      # sampler and here (Rust fmt check through vitest), where the sampler genuinely IS running and
      # must still be stopped so its evidence is reported and the process does not leak on the
      # physical host. Its own node invocations below already fail loudly via checked exit codes and
      # a trailing throw if node itself is unusable; they do not silently report success the way the
      # fixed steps above could.
      - name: Stop and report host sampler
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          EMEND_PARALLELISM: ${{ inputs.parallelism }}
          EMEND_CARGO_BUILD_JOBS: ${{ inputs.cargo_build_jobs }}
        run: |
          if (-not $env:EMEND_SAMPLER_PID) {
            throw 'Host sampler did not start; contention evidence is invalid.'
          }
          $expectedTicks = [long]$env:EMEND_SAMPLER_STARTED_TICKS
          $endedAt = (Get-Date).ToUniversalTime().ToString('o')
          $env:EMEND_SAMPLER_ENDED_AT = $endedAt
          $env:EMEND_BENCHMARK_ENDED_AT = $endedAt
          $sampler = Get-Process -Id ([int]$env:EMEND_SAMPLER_PID) -ErrorAction SilentlyContinue
          $cleanupError = $null
          if (-not $sampler) {
            $cleanupError = 'Host sampler exited before cleanup'
          }
          elseif ($sampler.StartTime.ToUniversalTime().Ticks -ne $expectedTicks) {
            $cleanupError = 'sampler process identity changed; refusing to stop reused PID'
          }
          else {
            New-Item -ItemType File -Path $env:EMEND_SAMPLER_STOP -Force | Out-Null
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              $sampler = Get-Process -Id ([int]$env:EMEND_SAMPLER_PID) -ErrorAction SilentlyContinue
              if (-not $sampler) { break }
              if ($sampler.StartTime.ToUniversalTime().Ticks -ne $expectedTicks) {
                $cleanupError = 'sampler process identity changed; refusing to stop reused PID'
                break
              }
              Start-Sleep -Seconds 1
            }
            if ($sampler -and -not $cleanupError) {
              if ($sampler.StartTime.ToUniversalTime().Ticks -ne $expectedTicks) {
                $cleanupError = 'sampler process identity changed; refusing to stop reused PID'
              }
              else {
                $cleanupError = 'Host sampler ignored its stop marker; forced stop invalidates evidence'
                Stop-Process -InputObject $sampler -Force -ErrorAction Stop
              }
            }
          }
          node scripts/windows-host-sampler-report.mjs $env:EMEND_SAMPLES_PATH "${{ matrix.slot }}" "${{ inputs.parallelism }}" $env:EMEND_CARGO_BUILD_JOBS
          $reportExit = $LASTEXITCODE
          node scripts/windows-contention-cohort.mjs finish
          $windowExit = $LASTEXITCODE
          if ($cleanupError) { throw $cleanupError }
          if ($reportExit -ne 0) { throw "Host sampler report rejected the evidence (exit $reportExit)" }
          if ($windowExit -ne 0) { throw "Benchmark window validation rejected the evidence (exit $windowExit)" }
