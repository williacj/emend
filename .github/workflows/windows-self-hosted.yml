# ABOUTME: Self-hosted Windows CI (issue #342) — runs the suites on real Windows hardware.
# ABOUTME: Reports the Windows PR check independently of hosted Actions availability.
# Refs: docs/ci-windows-runner.md (setup + status), test-plan §4/§8.
#
# Every PR runs the same named Windows check; a path filter could leave a PR untested.

name: Windows (self-hosted)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows_mode:
        description: Windows execution mode
        required: true
        default: suites
        type: choice
        options:
          - suites
          - focused-e2e-repeat
          - unsigned-nsis
      target_sha:
        description: Focused repeat or unsigned NSIS — immutable 40-character commit SHA to test
        required: false
        type: string
      iterations:
        description: Focused mode only — separate runs of the selected case (1-25)
        required: false
        default: "10"
        type: string
      test_grep:
        description: Focused mode only — Playwright grep selecting the case
        required: false
        default: Windows Recreate reports Reappeared without reading or overwriting
        type: string
      sccache_diagnostic:
        description: Safely exercise an otherwise disruptive sccache branch
        required: true
        default: none
        type: choice
        options:
          - none
          - preflight-failure
          - report-no-server
          - report-replaced
          - boot-trigger
  # Ratified in #984: a daily full-suite backstop bounds silent classifier drift.
  schedule:
    - cron: "17 8 * * *"

permissions:
  actions: read
  contents: read
  pull-requests: read

# Issue #822 required repository-wide serialization while runner services could share one `_work`
# tree. The #981 isolation canaries and six-run contention cohort proved runner ids 22 and 24 use
# distinct physical work roots; #982 therefore lets GitHub assign unrelated refs to both services.
# Obsolete queued PR revisions still fail closed through the live-head freshness check below.
# #1347 (CJ, 2026-08-10): this workflow stays UNGROUPED. #982's removal above is final, and
# no PR-keyed group is added on top of it. #1340 proved cancelling an obsolete run would be
# safe for PR verification, so the absence is a workload-policy decision, not a safety hold.
# Reopen only if Windows CI queue time is OBSERVED to block cards; the #1340 journal entry holds the
# tranche to measure then. A last-N run rate is not that evidence.

jobs:
  test-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.windows_mode != 'focused-e2e-repeat' && inputs.windows_mode != 'unsigned-nsis') }}
    # `self-hosted` and `Windows` are registration labels; `cowrite-required` is the operator-managed
    # admission capability from docs/ci-windows-runner.md. An unqualified service cannot receive this
    # job even while it remains registered and online. If no admitted runner is online, the job stays
    # queued and eventually fails rather than treating unavailable verification as successful.
    runs-on: [self-hosted, Windows, cowrite-required]
    name: Suites (Windows, self-hosted)
    # Only bounds the job once a runner has actually picked it up — NOT the queued state above.
    # Exact-head PR run 31902774002 needed 19m37 after E joined the aggregate, leaving 23 seconds under
    # the former 20-minute bound. Allow 25 minutes for the full suite. The 61k-file benchmark
    # stays operator-only (#1518).
    timeout-minutes: 25
    # The persistent service account owns one user-wide cache. Requiring the wrapper makes a missing
    # host prerequisite explicit instead of silently paying cold compilation while claiming caching.
    env:
      RUSTC_WRAPPER: sccache
      GGML_CCACHE: "OFF"
      # Only an operator dispatch can select a diagnostic. Pull requests and the daily schedule
      # resolve to `none`, and the terminal rejection below keeps every diagnostic run red so it can
      # never report a successful Windows PR check by accident (#1185).
      EMEND_SCCACHE_DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.sccache_diagnostic || 'none' }}
    # The runner service cannot execute a Microsoft Store/App Installer `pwsh.exe` alias under
    # WindowsApps (Access is denied), and this host's machine policy disables .ps1 files. Use inbox
    # Windows PowerShell 5.1 with a process-scoped policy bypass for Actions' generated temp script;
    # all commands here are deliberately 5.1-compatible, for the runner host.
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The classifier proves base ancestry before diffing immutable event trees. A depth-1 head
          # plus a separately depth-1-fetched base leaves both commits as disconnected shallow roots.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # Its `id` is load-bearing (#2275/#2295): `Classify applicable suites` below actually invokes
      # this pinned Node 20 (`node scripts/windows-ci-classifier.mjs`) under `!cancelled()`, which
      # stays TRUE after a failed step — the same shape #2275 fixed for `Install Rust`. Without this
      # gate a failed Node setup would let the classifier run anyway, against whatever node happened
      # to already be on the runner, and report `success` doing it. `Check revision freshness` needs
      # no equivalent gate: it carries no explicit `if:`, so its default `success()` semantics already
      # correctly no-run it when this step fails.
      - name: Setup Node.js
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          # v7 otherwise opts into automatic npm caching when package-manager metadata appears.
          package-manager-cache: false

      - name: Check revision freshness
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          EMEND_PR_NUMBER: ${{ github.event.pull_request.number }}
          EMEND_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/windows-ci-freshness.mjs

      # The classifier uses pinned Node 20 and must not run after a failed setup.
      - name: Classify applicable suites
        id: classifier
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' && steps.node.outcome == 'success' }}
        env:
          EMEND_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          EMEND_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/windows-ci-classifier.mjs

      # #1814: one directory per run for every suite's own results artifact, so the test-matrix
      # gate can prove the named tests EXECUTED and not merely that they are defined.
      #
      # Composed HERE, not in the job's `env:` block: the `runner` context is not available there,
      # and referencing it makes GitHub reject the whole workflow file. `$GITHUB_ENV` publishes the
      # value to every later step as an ordinary environment variable instead.
      #
      # Keyed by run id AND attempt, and cleared first: the self-hosted service reuses RUNNER_TEMP
      # between jobs, so an artifact surviving from an earlier run would let this one claim
      # execution evidence it never produced — the precise false pass this gate exists to end.
      - name: Prepare test-matrix results directory
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' }}
        run: |
          $dir = "$env:RUNNER_TEMP\matrix-results-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
          New-Item -ItemType Directory -Path $dir | Out-Null
          "EMEND_MATRIX_ARTIFACTS=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "matrix results directory: $dir"

      # Its `id` is load-bearing (#2275): every step that actually invokes the pinned rustc/cargo
      # gates on `steps.rust.outcome == 'success'` below, because `!cancelled()` stays TRUE after a
      # failed step. Without that gate a failed pin (observed live in run 33817279014: a transient
      # DNS error resolving static.rust-lang.org) let fmt/clippy/cargo test/the driver build run
      # anyway, against whatever toolchain happened to already be on the runner rather than the
      # pinned 1.97.0 — and report `success` while doing it.
      - name: Install Rust
        id: rust
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' && (steps.classifier.outputs.run_rust == 'true' || steps.classifier.outputs.run_e2e == 'true') }}
        # SHA-pinned, so the toolchain channel can't be read from the ref — set it explicitly.
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-09
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      # The sccache server is a per-user daemon shared by BOTH runner services — #981/#982 proved
      # distinct `_work` roots, not a distinct compiler cache. It is owned by a host Task Scheduler
      # task (docs/ci-windows-runner.md), never by a job: a job-spawned daemon is reaped when that
      # job completes, killing a concurrent job's compile mid-flight (#1178). This step is the job's
      # first sccache touch, so an absent server proves that host task is down. It cannot tell a
      # peer job's daemon from the host's; catching "the task stopped running" is the point.
      #
      # Its `id` is load-bearing: every Rust step and the e2e driver build below gate on
      # `steps.sccache.outcome == 'success'`,
      # because `!cancelled()` stays TRUE after a failed step. Without that gate this step would only
      # REPORT the outage — the job would throw here and then compile anyway under RUSTC_WRAPPER,
      # starting the very job-owned daemon this step forbids and killing a peer job's build when the
      # runner reaps it. It is gated on either suite that compiles, so a docs-only PR is never
      # red-gated by a daemon outage while an E-only PR still proves the driver build uses the host
      # daemon. That OR (not AND) is pinned by scripts/windows-workflow.test.mjs's exact-expression
      # assertion on this step's `if:`, not merely a substring-presence check — an E-only PR is
      # exactly the branch where AND would silently skip this step, then the driver build, then the
      # acceptance suite, leaving a green Windows PR check that ran zero acceptance tests.
      - name: Verify Rust compiler cache
        id: sccache
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' && (steps.classifier.outputs.run_rust == 'true' || steps.classifier.outputs.run_e2e == 'true') }}
        run: |
          if ($env:EMEND_SCCACHE_DIAGNOSTIC -eq 'preflight-failure') {
            throw "Forced sccache preflight failure for issue #1185; no cache process was inspected or started."
          }
          sccache --version
          $server = Get-Process sccache -ErrorAction SilentlyContinue |
            Sort-Object -Property StartTime |
            Select-Object -First 1
          if (-not $server) {
            throw "No sccache server is running: the host Task Scheduler task that owns it is down (docs/ci-windows-runner.md). A job must never start its own - a job-owned daemon dies with the job and breaks the concurrent job's build (#1178)."
          }
          Write-Output "sccache server pid=$($server.Id) started=$($server.StartTime.ToString('o'))"
          if ($env:EMEND_SCCACHE_DIAGNOSTIC -eq 'boot-trigger') {
            $bootedAt = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime
            $task = Get-ScheduledTask -TaskName 'sccache-server'
            $bootTriggers = @($task.Triggers | Where-Object { $_.CimClass.CimClassName -eq 'MSFT_TaskBootTrigger' })
            if (@($task.Triggers).Count -ne 1 -or $bootTriggers.Count -ne 1) {
              throw "sccache-server must have exactly one trigger, and it must be a BootTrigger."
            }
            $taskHistory = Get-WinEvent -ListLog 'Microsoft-Windows-TaskScheduler/Operational' -ErrorAction Stop
            Write-Output "Task Scheduler Operational history: enabled=$($taskHistory.IsEnabled) records=$($taskHistory.RecordCount)"
            if (-not $taskHistory.IsEnabled) {
              throw "Task Scheduler Operational history is disabled. From an elevated host shell, run: wevtutil sl Microsoft-Windows-TaskScheduler/Operational /e:true; then reboot before repeating this audit."
            }
            $bootEvent = Get-WinEvent -FilterHashtable @{
              LogName = 'Microsoft-Windows-TaskScheduler/Operational'
              Id = 118
              StartTime = $bootedAt
            } -ErrorAction SilentlyContinue |
              Where-Object {
                $eventXml = [xml]$_.ToXml()
                $taskName = @($eventXml.Event.EventData.Data |
                  Where-Object { $_.Name -eq 'TaskName' } |
                  Select-Object -First 1)
                $taskName.Count -eq 1 -and $taskName[0].InnerText -eq '\sccache-server'
              } |
              Sort-Object TimeCreated -Descending |
              Select-Object -First 1
            if (-not $bootEvent) {
              throw "Task Scheduler Operational Event ID 118 does not show sccache-server triggered by computer startup during the current boot. Enable history before boot, then reboot before repeating this audit."
            }
            $bootToTriggerSeconds = ($bootEvent.TimeCreated - $bootedAt).TotalSeconds
            $triggerToServerSeconds = [math]::Abs(($server.StartTime - $bootEvent.TimeCreated).TotalSeconds)
            Write-Output "sccache boot evidence: booted=$($bootedAt.ToString('o')) boot_triggered=$($bootEvent.TimeCreated.ToString('o')) server_started=$($server.StartTime.ToString('o'))"
            if ($bootToTriggerSeconds -lt 0 -or $bootToTriggerSeconds -gt 300) {
              throw "Task Scheduler did not record the sccache-server computer-startup trigger within five minutes after the current Windows boot."
            }
            if ($triggerToServerSeconds -gt 10) {
              throw "Task Scheduler's computer-startup trigger and the sccache server start differ by more than ten seconds."
            }
          }
          # Baseline the shared counters instead of zeroing them: --zero-stats wipes the numbers a
          # concurrent job on the same daemon is accumulating (#1178).
          sccache --show-stats | Out-File -FilePath "$env:RUNNER_TEMP\sccache-baseline.txt" -Encoding utf8

      - name: Rust fmt check
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' && steps.classifier.outputs.run_rust == 'true' && steps.rust.outcome == 'success' && steps.sccache.outcome == 'success' }}
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      # The admitted runner has MSVC tools but no cmake.exe (exact-head #2544 run 37038087562).
      # Provision Kitware's immutable Windows ZIP per job, verify its published SHA-256 before
      # extraction, and place only its bin directory on later steps' PATH. No host admin needed.
      - name: Provision CMake for Whisper
        id: cmake
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' && steps.classifier.outputs.run_rust == 'true' && steps.rust.outcome == 'success' && steps.sccache.outcome == 'success' }}
        run: |
          $version = '3.31.12'
          $archiveName = "cmake-$version-windows-x86_64.zip"
          $expected = '0c4baa40f28b3f8225eb3fdf6946c987b4fe901403b4eaf2fbbd9378100aaa0c'
          $root = Join-Path $env:RUNNER_TEMP "cowrite-cmake-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $archive = Join-Path $root $archiveName
          Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v$version/$archiveName" -OutFile $archive -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "CMake archive SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $bin = Join-Path $root "cmake-$version-windows-x86_64\bin"
          $exe = Join-Path $bin 'cmake.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Verified CMake archive has no expected executable: $exe" }
          $reported = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $reported[0] -ne "cmake version $version") { throw "Verified CMake executable did not report version $version" }
          Write-Output $reported[0]
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # whisper-rs-sys 0.15.0's bundled bindings were generated on Linux: on Windows their
      # `_G_fpos_t` and `_IO_FILE` layout assertions fail (run 37039601773). Bindgen must use a
      # Windows libclang. Pin the small native DLL package and verify its bytes before extraction.
      - name: Provision libclang for Whisper
        id: libclang
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' && steps.classifier.outputs.run_rust == 'true' && steps.rust.outcome == 'success' && steps.sccache.outcome == 'success' && steps.cmake.outcome == 'success' }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "cowrite-libclang-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $archive = Join-Path $root 'libclang.22.1.8.zip'
          $expected = '676b4aa346bc793af2fa05d80a9933825202ba65f71230417d5f0bb191dc3662'
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/libclang.runtime.win-x64/22.1.8' -OutFile $archive -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "libclang archive SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $bin = Join-Path $root 'runtimes\win-x64\native'
          $dll = Join-Path $bin 'libclang.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw "Verified libclang archive has no expected DLL: $dll" }
          "LIBCLANG_PATH=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Rust clippy
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' && steps.classifier.outputs.run_rust == 'true' && steps.rust.outcome == 'success' && steps.sccache.outcome == 'success' && steps.cmake.outcome == 'success' && steps.libclang.outcome == 'success' }}
        run: |
          Remove-Item Env:WHISPER_DONT_GENERATE_BINDINGS -ErrorAction SilentlyContinue
          cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      # --workspace runs every crate's tests (incl. crates/textops's proptest suite).
      # voice-inference compiles and runs feature-gated CPAL and Whisper tests on Windows; their names
      # must land in this same results artifact for the matrix execution gate (#2542).
      # libtest names every test it ran on stdout; that transcript is the `rust` kind's execution
      # evidence (#1814). `--format json` is still nightly-only at the pinned 1.97 toolchain and the
      # repo does not use cargo-nextest, so the stable human-readable transcript is what CI has.
      #
      # The stderr merge (#2308, so `Running <target> (<...>/<binary>-<hash>.exe)` reaches the
      # artifact) runs INSIDE `cmd /c '... 2>&1'`, never as a bare `2>&1` on a command PowerShell
      # invokes directly. PowerShell 5.1 wraps a directly-invoked native command's stderr, once
      # redirected with `2>&1`, in a `NativeCommandError` record — and this runner has
      # `$ErrorActionPreference = 'Stop'` in effect (not set in this workflow; confirmed by reading
      # a live run's own failure), under which that record is a TERMINATING error at cargo's first
      # stderr line, before a single test runs. Reproduced locally, both halves: the bare
      # `cargo test ... 2>&1 |` form throws under `$ErrorActionPreference = 'Stop'` (green only under
      # the non-default `Continue` a plain local check leaves in effect) and runs to completion
      # under `Continue` — exactly the shape that let this ship broken and pass every local check.
      # Doing the merge inside `cmd` sidesteps PowerShell's native-stderr handling entirely: from
      # PowerShell's side there is only ONE native invocation (`cmd.exe`), and its OWN stdout is
      # ordinary success-stream text, never touched by `$ErrorActionPreference`. This also closes
      # the ordering hazard a PowerShell-pipeline merge would otherwise leave open — cargo's stderr
      # and a spawned test binary's inherited stdout are two independently-buffered handles that
      # PowerShell's own object pipeline does not interleave in write order, where `cmd`'s `2>&1` is
      # a single OS-handle merge, so a target's `Running` header is verified (not merely expected) to
      # land immediately before that target's own result lines. Verified against real cargo output on
      # this host, under `$ErrorActionPreference = 'Stop'`: a passing run completes with
      # `$LASTEXITCODE = 0` and the artifact carries the real `CARGO_TERM_COLOR=always` bytes this
      # runner emits (this host has that variable set too, confirmed independently of CI); a induced
      # failing test propagates cargo's real `101` exit code through `cmd`'s own exit code unchanged.
      # Tee keeps the rest of the log identical to before; $LASTEXITCODE is re-checked explicitly
      # because the pipeline, not cargo (or cmd), is the step's last command.
      - name: Cargo test
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' && steps.classifier.outputs.run_rust == 'true' && steps.rust.outcome == 'success' && steps.sccache.outcome == 'success' && steps.cmake.outcome == 'success' && steps.libclang.outcome == 'success' }}
        run: |
          if (-not $env:EMEND_MATRIX_ARTIFACTS) { throw "EMEND_MATRIX_ARTIFACTS is unset: the results-directory step did not run" }
          if (-not $env:LIBCLANG_PATH -or -not (Test-Path -LiteralPath (Join-Path $env:LIBCLANG_PATH 'libclang.dll'))) { throw "Verified Windows libclang was not published to Cargo" }
          Remove-Item Env:WHISPER_DONT_GENERATE_BINDINGS -ErrorAction SilentlyContinue
          cmd /c 'cargo test --manifest-path src-tauri/Cargo.toml --workspace 2>&1' |
            Tee-Object -FilePath "$env:EMEND_MATRIX_ARTIFACTS\rust-windows.txt"
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed with exit code $LASTEXITCODE" }

      # TD-18's filesystem timing is operator evidence outside normal PR verification (test-plan §6). Keeping it
      # on workflow_dispatch means an operator can benchmark the exact selected branch revision on
      # the real Windows host without charging every PR or scheduled backstop for 61k fixture files.
      - name: Project files scanner benchmark
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && steps.freshness.outputs.run_expensive != 'false' && steps.classifier.outputs.run_rust == 'true' && steps.rust.outcome == 'success' && steps.sccache.outcome == 'success' && steps.cmake.outcome == 'success' && steps.libclang.outcome == 'success' }}
        run: |
          Write-Output "revision=$(git rev-parse HEAD)"
          Write-Output "runner=$env:RUNNER_NAME os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"
          $processor = Get-CimInstance Win32_Processor | Select-Object -First 1
          Write-Output "processor=$($processor.Name) logical_processors=$($processor.NumberOfLogicalProcessors)"
          $workspaceDrive = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).PSDrive
          $workspaceVolume = Get-Volume -DriveLetter $workspaceDrive.Name
          Write-Output "workspace_drive=$($workspaceDrive.Name) filesystem=$($workspaceVolume.FileSystem) drive_type=$($workspaceVolume.DriveType)"
          cargo bench --manifest-path src-tauri/Cargo.toml --bench project_files_scan

      - name: Install dependencies
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' && steps.classifier.outputs.run_node == 'true' && steps.node.outcome == 'success' }}
        run: npm ci

      - name: tooling self-test
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' && steps.classifier.outputs.run_tooling == 'true' && steps.node.outcome == 'success' }}
        run: |
          if (-not $env:EMEND_MATRIX_ARTIFACTS) { throw "EMEND_MATRIX_ARTIFACTS is unset: the results-directory step did not run" }
          $env:EMEND_TEST_RESULTS_FILE = "$env:EMEND_MATRIX_ARTIFACTS\node-scripts.jsonl"
          npm run test:scripts:ci

      # Existence-only, and deliberately early: a mistyped test name should fail in seconds rather
      # than after the whole suite set. The execution half runs at the end, once every suite that
      # this revision selected has produced its results artifact.
      - name: Validate docs/test-matrix.md
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' && steps.classifier.outputs.run_tooling == 'true' && steps.node.outcome == 'success' }}
        run: npm run matrix:check

      - name: Validate vitest unhandled-errors invariant (test-plan §9b)
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' && steps.classifier.outputs.run_tooling == 'true' && steps.node.outcome == 'success' }}
        run: npm run check:vitest-unhandled-errors

      # --if-present matches ci.yml: skips cleanly until vitest is configured, still fails the job
      # on a real test failure once it is.
      # The second reporter is #1814's execution evidence for the `vitest` kind; `default` keeps the
      # console output this step already produced.
      - name: vitest
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' && steps.classifier.outputs.run_frontend == 'true' && steps.node.outcome == 'success' }}
        run: |
          if (-not $env:EMEND_MATRIX_ARTIFACTS) { throw "EMEND_MATRIX_ARTIFACTS is unset: the results-directory step did not run" }
          npm run test --if-present -- --reporter=default --reporter=json --outputFile.json="$env:EMEND_MATRIX_ARTIFACTS\vitest-windows.json"

      # Chromium is the sole project in playwright.config.mjs. `--with-deps` only adds OS packages
      # on Linux, so the self-hosted Windows runner needs the browser install alone.
      - name: Install Playwright Chromium
        id: playwright
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' && steps.classifier.outputs.run_e2e == 'true' && steps.node.outcome == 'success' }}
        run: npx playwright install chromium

      # Keep compilation failure distinct from the driver's 120-second webServer startup budget.
      - name: Pre-build the headless test driver
        id: e2e-driver
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' && steps.classifier.outputs.run_e2e == 'true' && steps.rust.outcome == 'success' && steps.sccache.outcome == 'success' }}
        run: cargo build --manifest-path src-tauri/Cargo.toml -p test-driver

      # `steps.node.outcome == 'success'` is added directly (#2295 review round 2) rather than left to
      # the transitive chain through `steps.playwright.outcome`/`steps.e2e-driver.outcome`: that chain's
      # protection against a failed Node setup rests on "a skipped step's outcome is not 'success'",
      # which no unconfounded run in this workflow's history isolates (DH-26 clause 4). This step's own
      # `run_e2e == 'true'` conjunct already implies the classifier ran, which already implies
      # `steps.node.outcome == 'success'` — so the added conjunct cannot over-gate, only remove the
      # unexecuted inference.
      - name: Playwright acceptance suite
        if: ${{ !cancelled() && steps.freshness.outputs.run_expensive != 'false' && steps.classifier.outputs.run_e2e == 'true' && steps.node.outcome == 'success' && steps.sccache.outcome == 'success' && steps.playwright.outcome == 'success' && steps.e2e-driver.outcome == 'success' }}
        # The shared config retries generic CI twice. The Windows PR check should report the first
        # acceptance failure, so override retries at this command edge (#1403/#1595).
        # EMEND_E2E_RESULTS_FILE adds the JSON reporter beside `list` (playwright.config.mjs) —
        # this command keeps `--grep-invert @quarantine`, so a quarantined case is absent from the
        # document and correctly reads as "did not execute in this run" (#1814).
        run: |
          if (-not $env:EMEND_MATRIX_ARTIFACTS) { throw "EMEND_MATRIX_ARTIFACTS is unset: the results-directory step did not run" }
          $env:EMEND_E2E_RESULTS_FILE = "$env:EMEND_MATRIX_ARTIFACTS\e2e-windows.json"
          npm run test:e2e:ci -- --retries=0

      # The strong half of the test-plan §9 gate (#1814): every matrix row's named test must appear
      # as EXECUTED in the artifact the suite itself produced above.
      #
      # Which kinds this job BLOCKS on, and which it merely observes, is stated normatively in
      # `docs/test-plan.md` §9 ("The gate names its own reach") — including why the observed pair
      # is observed and that widening it is CJ's call on #2234, not a config tweak. The checker
      # prints both lists on its summary line every run, so the reach is read, never inferred.
      #
      # `success()` (not `!cancelled()`) because a suite that already failed leaves a partial
      # artifact, and a red job does not need a second, noisier reason.
      - name: Validate test-matrix execution evidence
        if: ${{ success() && steps.freshness.outputs.run_expensive != 'false' }}
        env:
          EMEND_RUN_FRONTEND: ${{ steps.classifier.outputs.run_frontend }}
          EMEND_RUN_E2E: ${{ steps.classifier.outputs.run_e2e }}
        run: |
          if (-not $env:EMEND_MATRIX_ARTIFACTS) { throw "EMEND_MATRIX_ARTIFACTS is unset: the results-directory step did not run" }
          $kinds = @()
          if ($env:EMEND_RUN_FRONTEND -eq 'true') { $kinds += 'vitest' }
          if ($env:EMEND_RUN_E2E -eq 'true') { $kinds += 'e2e' }
          # One invocation, built as an argument array: the checker rejects an empty
          # --require-kinds value on purpose, and appending the pair only when there is one keeps
          # that strictness without writing the command out twice.
          $argv = @('scripts/check-test-matrix.mjs', '--artifacts', $env:EMEND_MATRIX_ARTIFACTS)
          if ($kinds.Count -gt 0) { $argv += @('--require-kinds', ($kinds -join ',')) }
          node $argv
          if ($LASTEXITCODE -ne 0) { throw "test-matrix execution check failed with exit code $LASTEXITCODE" }

      - name: Upload Playwright report
        if: ${{ failure() && steps.freshness.outputs.run_expensive != 'false' && steps.classifier.outputs.run_e2e == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-windows
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # The daemon outlives every job, so its raw counters are cumulative. Print those for debugging,
      # then a per-run delta against the preflight baseline — windows-ci-soak-report.mjs takes the
      # LAST match per counter, so the delta block must be printed last. Honest limit: when two jobs
      # overlap, the delta still includes the peer's compilations. One shared daemon cannot attribute
      # work per job, so a #978-style timing comparison belongs in a serialized window (#1178).
      - name: Report Rust compiler cache
        if: ${{ always() && steps.freshness.outputs.run_expensive != 'false' && (steps.classifier.outputs.run_rust == 'true' || steps.classifier.outputs.run_e2e == 'true') }}
        continue-on-error: true
        run: |
          $server = Get-Process sccache -ErrorAction SilentlyContinue
          if ($env:EMEND_SCCACHE_DIAGNOSTIC -eq 'report-no-server') { $server = $null }
          if (-not $server) {
            Write-Output "No sccache server is running; skipping statistics rather than starting a job-owned daemon (#1178)."
            return
          }
          $names = @('Compile requests', 'Cache hits', 'Cache misses', 'Cache read errors', 'Cache write errors', 'Cache errors')
          function Read-Counters($lines) {
            $out = @{}
            foreach ($name in $names) {
              $pattern = '^' + [regex]::Escape($name) + '\s+(\d+)\s*$'
              $out[$name] = 0
              foreach ($line in $lines) {
                if ($line -match $pattern) { $out[$name] = [int]$Matches[1]; break }
              }
            }
            $out
          }
          $current = sccache --show-stats
          $current
          $baseline = @()
          $baselinePath = "$env:RUNNER_TEMP\sccache-baseline.txt"
          if (Test-Path $baselinePath) { $baseline = Get-Content $baselinePath }
          $before = Read-Counters $baseline
          $after = Read-Counters $current
          if ($env:EMEND_SCCACHE_DIAGNOSTIC -eq 'report-replaced') {
            foreach ($name in $names) { $before[$name] = $after[$name] + 1 }
          }
          $replaced = $false
          foreach ($name in $names) { if ($after[$name] -lt $before[$name]) { $replaced = $true } }
          if ($replaced) {
            Write-Warning "sccache counters went backwards: the daemon was replaced during this job (#1178). Reporting its current totals as the best available per-run estimate."
          }
          Write-Output "This run (delta against the step-start baseline):"
          foreach ($name in $names) {
            $delta = $after[$name] - $before[$name]
            if ($replaced) { $delta = $after[$name] }
            Write-Output ("{0,-22} {1,10}" -f $name, $delta)
          }

      - name: Publish timing summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/windows-ci-timing.mjs publish

      # Diagnostic dispatches deliberately publish a failed Windows check: they exercise failure
      # handling, not normal PR verification. This remains terminal and `always()` so the report-only
      # diagnostics cannot turn green after their injected branch returns successfully (#1185).
      - name: Reject sccache diagnostic as merge evidence
        if: ${{ always() && env.EMEND_SCCACHE_DIAGNOSTIC != 'none' }}
        run: throw "Sccache diagnostic runs cannot satisfy the Windows PR check (#1185)."

      # A short-circuited run must not report success if the PR is later force-pushed
      # back to this commit. Publish timing first, then end non-successfully.
      - name: Reject obsolete revision as merge evidence
        if: ${{ always() && steps.freshness.outputs.run_expensive == 'false' }}
        run: throw "Obsolete revision cannot satisfy the Windows PR check; full suites did not run."

  # Operator-only #2612 packaging evidence. This job is separate from the stable PR check and
  # never runs on pull requests, schedules, or the ordinary full-suite dispatch. The immutable
  # target lets an operator build the exact PR head before merging while resource use is measured.
  unsigned-nsis:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_mode == 'unsigned-nsis' }}
    name: Unsigned NSIS (Windows, self-hosted)
    runs-on: [self-hosted, Windows, cowrite-required]
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      GGML_CCACHE: "OFF"
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Validate unsigned NSIS target SHA
        env:
          EMEND_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          if ($env:EMEND_TARGET_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'target_sha must be an immutable 40-character commit SHA'
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}

      - name: Verify unsigned NSIS checkout
        env:
          EMEND_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EMEND_TARGET_SHA) {
            throw "Checkout is not the requested exact head: $actual"
          }
          Write-Output "Building unsigned NSIS for $actual"

      - name: Setup Node.js for unsigned NSIS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install Rust for unsigned NSIS
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-09
        with:
          toolchain: 1.97.0

      - name: Verify Rust compiler cache for unsigned NSIS
        run: |
          sccache --version
          $server = Get-Process sccache -ErrorAction SilentlyContinue |
            Sort-Object -Property StartTime |
            Select-Object -First 1
          if (-not $server) {
            throw "No externally owned sccache server is running (docs/ci-windows-runner.md, #1178)."
          }
          Write-Output "sccache server pid=$($server.Id) started=$($server.StartTime.ToString('o'))"

      - name: Provision Windows Whisper tools for unsigned NSIS
        run: ./scripts/provision-whisper-windows.ps1

      - name: Install dependencies for unsigned NSIS
        run: npm ci

      - name: Remove prior unsigned NSIS output
        run: |
          $bundle = 'src-tauri/target/release/bundle/nsis'
          if (Test-Path -LiteralPath $bundle) { Remove-Item -LiteralPath $bundle -Recurse -Force }

      - name: Build unsigned NSIS with normal features
        run: npm run tauri -- build --ci --no-sign --bundles nsis

      - name: Inspect unsigned NSIS and app executable
        run: |
          $exe = 'src-tauri/target/release/emend.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Normal app build produced no $exe" }
          $app = Get-Item -LiteralPath $exe
          if ($app.Length -lt 1048576) { throw "App executable is unexpectedly small: $($app.Length) bytes" }
          Get-FileHash -LiteralPath $exe -Algorithm SHA256
          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one unsigned NSIS bundle, found $($installers.Count)" }
          if ($installers[0].Length -lt 1048576) { throw "NSIS bundle is unexpectedly small: $($installers[0].Length) bytes" }
          Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256

      - name: Upload unsigned NSIS evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-nsis-${{ inputs.target_sha }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  # Operator-only #1595 validation. Keeping this mode inside a workflow already registered on the
  # default branch makes it dispatchable against a PR ref; a newly added standalone workflow cannot
  # receive workflow_dispatch events until it first exists on the default branch. Normal PR,
  # scheduled, and default manual runs skip this job and retain the normal PR check above.
  # The job name differs from the normal Windows PR check.
  e2e-focused-repeat:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_mode == 'focused-e2e-repeat' }}
    name: E2E focused repeat (Windows, self-hosted)
    runs-on: [self-hosted, Windows, cowrite-required]
    # Each iteration restarts Vite and the headless driver. Measured on this host (run 31909352072):
    # ten iterations plus all preparation in 2m53s, about 4s per iteration after the first, so the
    # ceiling of 25 sits far inside this budget.
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      GGML_CCACHE: "OFF"
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Validate focused dispatch inputs
        env:
          EMEND_TARGET_SHA: ${{ inputs.target_sha }}
          EMEND_ITERATIONS: ${{ inputs.iterations }}
          EMEND_TEST_GREP: ${{ inputs.test_grep }}
        run: |
          if ($env:EMEND_TARGET_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'target_sha must be an immutable 40-character commit SHA'
          }
          if ($env:EMEND_ITERATIONS -notmatch '^([1-9]|1[0-9]|2[0-5])$') {
            throw 'iterations must be a canonical integer from 1 to 25'
          }
          if ([string]::IsNullOrWhiteSpace($env:EMEND_TEST_GREP)) {
            throw 'test_grep must select a case; an empty pattern would run the whole suite'
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}

      - name: Setup Node.js for focused e2e
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install Rust for focused e2e
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-09
        with:
          toolchain: 1.97.0

      # Both runner services share a per-user sccache daemon owned by a host Task Scheduler task.
      # A job may use it but must never start its own: a job-owned daemon is reaped when that job
      # ends, killing a concurrent job's compile mid-flight (#1178).
      - name: Verify Rust compiler cache for focused e2e
        run: |
          sccache --version
          $server = Get-Process sccache -ErrorAction SilentlyContinue |
            Sort-Object -Property StartTime |
            Select-Object -First 1
          if (-not $server) {
            throw "No externally owned sccache server is running (docs/ci-windows-runner.md, #1178)."
          }
          Write-Output "sccache server pid=$($server.Id) started=$($server.StartTime.ToString('o'))"

      - name: Install dependencies for focused e2e
        run: npm ci

      - name: Install Playwright Chromium for focused e2e
        run: npx playwright install chromium

      # Keep compilation failure distinct from the driver's 120-second webServer startup budget.
      - name: Pre-build the headless test driver for focused e2e
        run: cargo build --manifest-path src-tauri/Cargo.toml -p test-driver

      # Every iteration is its own Playwright process, matching the reported failure shape. Run all
      # iterations so the log preserves the observed rate, then fail the job if any iteration failed.
      # Aggregate passing would be the retry-masking this operator mode exists to prevent.
      - name: Repeat the focused case with retries disabled
        env:
          EMEND_ITERATIONS: ${{ inputs.iterations }}
          EMEND_TEST_GREP: ${{ inputs.test_grep }}
        run: |
          $iterations = [int]$env:EMEND_ITERATIONS
          $failed = @()
          for ($i = 1; $i -le $iterations; $i++) {
            Write-Output "::group::iteration $i of $iterations"
            # No `--grep-invert @quarantine` here, unlike the normal PR job's `test:e2e:ci`: an operator
            # asking about one named case may well be asking about a quarantined one.
            npx playwright test --retries=0 --reporter=list --grep "$env:EMEND_TEST_GREP"
            $status = $LASTEXITCODE
            Write-Output "::endgroup::"
            Write-Output "iteration $i exit=$status"
            if ($status -ne 0) { $failed += $i }
          }
          Write-Output "iterations=$iterations failed=$($failed.Count)"
          if ($failed.Count -gt 0) {
            throw "Focused case failed on $($failed.Count) of $iterations iterations (iterations: $($failed -join ', ')). With retries disabled, that is the failure the suite's retry would have reported as flaky."
          }

      - name: Upload focused Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-focused-repeat
          path: |
            playwright-report/
            test-results/
          retention-days: 7
