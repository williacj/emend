# ABOUTME: CI/CD pipeline matrices for shipped macOS/Windows and platform-independent Ubuntu checks.
# ABOUTME: Lint, the per-OS merge gate (all four suites plus matrix execution evidence), app builds, the benchmark stub.
# Refs: test-plan §1,6; P0-2 acceptance: green on macOS + Windows for the scaffold.
# Third-party actions are pinned to commit SHAs (supply-chain hygiene); the trailing comment is the human-readable tag.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Feature branches get CI via their PR (not the push event) — avoids duplicate
# runs. cancel-in-progress only for PRs: superseded PR runs are cancelled to save
# runner minutes, but pushes to main always run to completion so every mainline
# commit keeps its own CI signal.
# Read-only: no job here writes to the repository. Artifact upload and download use the run's own
# runtime token, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ggml's CMake project independently auto-detects sccache for C/C++ compilation. Do not make
# native Whisper builds depend on an ambient cache daemon; Rust's RUSTC_WRAPPER is separate.
env:
  GGML_CCACHE: "OFF"

jobs:
  # Rust lint/format checks (all platforms). No Node toolchain here, so a missing
  # npm install can't fail the Rust checks.
  lint:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    name: Lint (${{ matrix.os }})
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        # SHA-pinned, so the toolchain channel can't be read from the ref — set it explicitly.
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-09
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      # Tauri's -sys crates need the system webkit/gtk libs to link during clippy.
      # macOS/Windows ship the WebView system libs; only Linux needs them installed.
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libclang-dev cmake libasound2-dev

      - name: Provision Windows Whisper tools
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/provision-whisper-windows.ps1

      - name: Verify macOS Whisper tools
        if: matrix.os == 'macos-latest'
        run: |
          cmake --version
          clang_dir="$(dirname "$(dirname "$(xcrun --find clang)")")/lib"
          test -f "$clang_dir/libclang.dylib"
          echo "LIBCLANG_PATH=$clang_dir" >> "$GITHUB_ENV"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      # rustfmt is platform-independent — run it once (Linux) rather than on every
      # runner in the matrix.
      - name: Rust fmt check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      # --workspace lints every crate (incl. crates/textops), --all-targets also
      # lints test/bench/example code, not just the default build.
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

  # The merge gate (test-plan §8/§9; CJ, 2026-11-08, williacj/emend#2): every suite on each shipped
  # OS (D23). Each leg uploads the results artifact every suite wrote; `matrix-evidence` below
  # checks both legs together, because a platform-specific test runs on one OS only. A suite that
  # did not run leaves no evidence, and the check fails rather than reading a missing artifact as
  # a pass (#1814).
  suites:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    name: Suites (${{ matrix.os }})
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-09
        with:
          toolchain: 1.97.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Provision Windows Whisper tools
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/provision-whisper-windows.ps1

      - name: Verify macOS Whisper tools
        if: matrix.os == 'macos-latest'
        run: |
          cmake --version
          clang_dir="$(dirname "$(dirname "$(xcrun --find clang)")")/lib"
          test -f "$clang_dir/libclang.dylib"
          echo "LIBCLANG_PATH=$clang_dir" >> "$GITHUB_ENV"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      # Each artifact is named `<kind>-...-<label>` (scripts/test-execution-results.mjs). The OS
      # label keeps the two legs' files distinct when `matrix-evidence` merges them into one
      # directory. A hosted runner starts empty, so no artifact from an earlier run can stand in
      # for this one.
      - name: Prepare test-matrix results directory
        run: |
          dir="$RUNNER_TEMP/matrix-results"
          mkdir -p "$dir"
          echo "EMEND_MATRIX_ARTIFACTS=$dir" >> "$GITHUB_ENV"

      # The last setup step, on the default `success()`: its outcome is `success` only when every
      # setup step above it succeeded, so the suite steps gate on it alone.
      - name: Install dependencies
        id: deps
        run: npm ci

      # Every suite step below runs once setup succeeded, even after an earlier suite failed, so one
      # run reports every failing suite. None may carry any other condition: a suite that can be
      # skipped on one OS goes unnoticed once both legs' evidence is read together.
      - name: tooling self-test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          EMEND_TEST_RESULTS_FILE: ${{ runner.temp }}/matrix-results/node-scripts-${{ matrix.label }}.jsonl
        run: npm run test:scripts:ci

      # Existence-only, and early: a mistyped test name fails in seconds. The execution half runs
      # last, once every suite has written its results artifact.
      - name: Validate docs/test-matrix.md
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run matrix:check

      - name: Validate vitest unhandled-errors invariant (test-plan §9b)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run check:vitest-unhandled-errors

      - name: vitest
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run test -- --reporter=default --reporter=json --outputFile.json="$EMEND_MATRIX_ARTIFACTS/vitest-${{ matrix.label }}.json"

      # stdout and stderr share one pipe, so each target's `Running` header lands immediately
      # before that target's own result lines in the transcript the execution check reads.
      # bash runs with `-eo pipefail`, so cargo's exit code fails the step through `tee`.
      - name: Cargo test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace 2>&1 | tee "$EMEND_MATRIX_ARTIFACTS/rust-${{ matrix.label }}.txt"

      - name: Install Playwright Chromium
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npx playwright install chromium

      # Keeps compilation failure distinct from the driver's 120-second webServer startup budget.
      - name: Pre-build the headless test driver
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: cargo build --manifest-path src-tauri/Cargo.toml -p test-driver

      # The shared config retries CI runs; the gate overrides that so a first-attempt failure is red
      # (#1403/#1595). `test:e2e:ci` leaves out @quarantine cases, which the execution check then
      # reads as not executed in this run.
      - name: Playwright acceptance suite
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          EMEND_E2E_RESULTS_FILE: ${{ runner.temp }}/matrix-results/e2e-${{ matrix.label }}.json
        run: |
          npm run test:e2e:ci -- --retries=0

      - name: Upload test-matrix results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matrix-results-${{ matrix.label }}
          path: ${{ runner.temp }}/matrix-results/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.label }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # A plain Tauri production build must include the default inference feature, leave a real
  # native executable, and produce an unsigned app bundle on each shipped OS. The first
  # --no-bundle step isolates compilation/linking from packaging; --no-sign keeps both steps
  # independent of operator signing credentials.
  build-app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Unsigned app build (${{ matrix.os }})
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-09
        with:
          toolchain: 1.97.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Provision Windows Whisper tools
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/provision-whisper-windows.ps1

      - name: Verify macOS Whisper tools
        if: matrix.os == 'macos-latest'
        run: |
          cmake --version
          clang_dir="$(dirname "$(dirname "$(xcrun --find clang)")")/lib"
          test -f "$clang_dir/libclang.dylib"
          echo "LIBCLANG_PATH=$clang_dir" >> "$GITHUB_ENV"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned app with normal features
        run: npm run tauri -- build --no-bundle --ci --no-sign

      - name: Bundle unsigned Windows app
        if: matrix.os == 'windows-latest'
        run: npm run tauri -- build --ci --no-sign --bundles nsis

      - name: Bundle unsigned macOS app
        if: matrix.os == 'macos-latest'
        run: npm run tauri -- build --ci --no-sign --bundles app

      - name: Inspect Windows app executable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/emend.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Normal app build produced no $exe" }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -lt 1048576) { throw "App executable is unexpectedly small: $($item.Length) bytes" }
          Get-FileHash -LiteralPath $exe -Algorithm SHA256
          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one unsigned NSIS app bundle, found $($installers.Count)" }
          if ($installers[0].Length -lt 1048576) { throw "NSIS app bundle is unexpectedly small" }
          Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256

      - name: Inspect macOS app executable
        if: matrix.os == 'macos-latest'
        run: |
          exe=src-tauri/target/release/emend
          test -s "$exe"
          file "$exe" | grep -q 'Mach-O'
          shasum -a 256 "$exe"
          app=src-tauri/target/release/bundle/macos/Emend.app
          test -d "$app/Contents/MacOS"
          test -s "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          bundle_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          test -n "$bundle_name"
          case "$bundle_name" in */*|.|..) exit 1 ;; esac
          bundle_exe="$app/Contents/MacOS/$bundle_name"
          test -s "$bundle_exe"
          test -x "$bundle_exe"
          file "$bundle_exe" | grep -q 'Mach-O'

  # FR-traceability gate (test-plan §9): every FR/property has a matrix row and
  # every row that names a test names one that exists and would run. Runs on one
  # runner (platform-independent like rustfmt/typecheck). scripts/pretest-typecheck.test.mjs
  # (issue #486) shells out to `npm run pretest` -> tsc, which lives in node_modules/.bin,
  # so — unlike before that file existed — this job now needs a real `npm ci` first.
  test-matrix:
    runs-on: ubuntu-latest
    name: Test-matrix traceability
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: npm ci
        run: npm ci

      # Self-test the enforcement script first (fixtures that must pass/fail),
      # then run it against the real matrix.
      - name: Enforcement script self-test
        run: npm run test:scripts

      # Existence-only, and the run says so out loud (#1814). This is fast feedback on Linux; the
      # execution half of the §9 gate runs at the end of each `suites` job, where every suite
      # writes its results artifact.
      - name: Validate docs/test-matrix.md
        run: npm run matrix:check

      - name: Validate vitest unhandled-errors invariant (test-plan §9b)
        run: npm run check:vitest-unhandled-errors

  # The strong half of the test-plan §9 gate (#1814): every matrix row's named test must appear as
  # executed in the results of the Windows or the macOS leg. Results of one kind from several
  # artifacts are read as one set (scripts/test-execution-results.mjs), so a Windows-only or
  # Unix-only test counts once it ran on its own OS. `!cancelled()` rather than the default, because
  # a job skipped after a failed leg would read as passing; this job fails instead.
  matrix-evidence:
    needs: suites
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    name: Test-matrix execution evidence
    timeout-minutes: 15
    steps:
      - name: Require both Suites legs to pass
        if: ${{ needs.suites.result != 'success' }}
        run: |
          echo "Suites result: ${{ needs.suites.result }}; no execution evidence to check."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Download both legs' results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: matrix-results-*
          path: ${{ runner.temp }}/matrix-results
          merge-multiple: true

      # Reading both legs together credits a test that ran on either OS, so it cannot see a whole
      # suite stop producing results on one of them. Require every suite's artifact from each leg.
      - name: Require every suite's results from both legs
        run: |
          dir="$RUNNER_TEMP/matrix-results"
          missing=0
          for label in windows macos; do
            for file in "node-scripts-$label.jsonl" "vitest-$label.json" "rust-$label.txt" "e2e-$label.json"; do
              if [ ! -s "$dir/$file" ]; then echo "missing or empty: $file"; missing=1; fi
            done
          done
          exit "$missing"

      - name: Validate test-matrix execution evidence
        run: node scripts/check-test-matrix.mjs --artifacts "$RUNNER_TEMP/matrix-results" --require-kinds vitest,e2e

  # Benchmark stub (implemented in P2b-10). Per test-plan §6, performance budgets
  # must run on a dedicated/consistent runner with relative regression thresholds
  # — NOT a shared GitHub runner (wall-clock on shared runners is flaky). The stub
  # runs on macos-latest only because it does no timing yet.
  benchmark:
    runs-on: macos-latest
    name: Benchmark (stub)
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Placeholder
        run: echo "Benchmark job stub (implemented in P2b-10)"
