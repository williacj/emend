# ABOUTME: Manifest for the detached-launcher-test-helper binary used by launcher platform tests.
# ABOUTME: The helper runs as a real parent or routed child and depends on the `emend` app package.
[package]
name = "detached-launcher-test-helper"
version = "0.1.0"
edition = "2021"
description = "Minimal parent/child helper for Emend detached-launcher platform tests."

[[bin]]
name = "detached-launcher-test-helper"
path = "src/main.rs"

[dependencies]
emend = { path = "../.." }
uuid = "1"
