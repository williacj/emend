# ABOUTME: Fake-agent test rig — spawnable CLI that replays scripted stream-JSON
# ABOUTME: scenarios (test-plan §1). Standalone crate; never a dependency of the app.
[package]
name = "fake-agent"
default-run = "fake-agent"
version = "0.1.0"
edition = "2021"
description = "Scriptable fake agentic CLI: replays scenario-driven stream-JSON events for deterministic tests (test-plan §1)."

[lib]
name = "fake_agent"
path = "src/lib.rs"

[[bin]]
name = "fake-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
provider-contract = { path = "../provider-contract" }

[[bin]]
name = "permission-provider"
path = "src/permission_provider.rs"
