# ABOUTME: Manifest for the fixtures library crate, the loader for the open-source fixture corpus.
# ABOUTME: Its serde dependencies support reading the corpus manifest that tests load fixtures through.
[package]
name = "fixtures"
version = "0.1.0"
edition = "2021"
description = "Loader for the open-source fixture corpus (P0-4): exposes committed docs + license manifest to tests."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
