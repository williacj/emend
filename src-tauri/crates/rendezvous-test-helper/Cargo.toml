# ABOUTME: Manifest for the rendezvous-test-helper binary used by project-routing rendezvous tests.
# ABOUTME: The helper is a real separate owner process and depends on the `emend` app package.
[package]
name = "rendezvous-test-helper"
version = "0.1.0"
edition = "2021"
description = "Minimal cross-process owner for Emend project-routing rendezvous tests."

[[bin]]
name = "rendezvous-test-helper"
path = "src/main.rs"

[dependencies]
emend = { path = "../.." }
