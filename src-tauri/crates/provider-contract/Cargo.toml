# ABOUTME: Manifest for the provider-contract library crate, which validates the Emend provider contract.
# ABOUTME: Its JSON and JSON Schema dependencies check stream-JSON and MCP payloads against published schemas.
[package]
name = "provider-contract"
version = "0.1.0"
edition = "2021"
description = "Validation helper for the Emend provider contract (stream-JSON grammar + MCP payloads) against the published docs/formats schemas."

[dependencies]
serde_json = "1"
jsonschema = { version = "0.26", default-features = false }
